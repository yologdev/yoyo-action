name: Sync Sponsors

on:
  schedule:
    - cron: '0 * * * *'  # Hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch sponsors
        env:
          GH_TOKEN: ${{ secrets.SPONSOR_PAT }}
        run: |
          # Query GitHub Sponsors API for active sponsors
          # Try user first, fall back to organization
          QUERY_USER='query {
            user(login: "yologdev") {
              sponsorshipsAsMaintainer(first: 100, activeOnly: true) {
                nodes {
                  sponsorEntity {
                    ... on User { login }
                    ... on Organization { login }
                  }
                }
              }
            }
          }'
          QUERY_ORG='query {
            organization(login: "yologdev") {
              sponsorshipsAsMaintainer(first: 100, activeOnly: true) {
                nodes {
                  sponsorEntity {
                    ... on User { login }
                    ... on Organization { login }
                  }
                }
              }
            }
          }'

          if gh api graphql -f query="$QUERY_USER" \
            --jq '[.data.user.sponsorshipsAsMaintainer.nodes[].sponsorEntity.login]' > sponsors.json 2>/dev/null; then
            echo "Fetched sponsors (user account)"
          elif gh api graphql -f query="$QUERY_ORG" \
            --jq '[.data.organization.sponsorshipsAsMaintainer.nodes[].sponsorEntity.login]' > sponsors.json 2>/dev/null; then
            echo "Fetched sponsors (organization)"
          else
            echo "WARNING: Could not fetch sponsors. Keeping existing list."
            exit 0
          fi

          echo "Sponsors: $(cat sponsors.json)"

      - name: Commit if changed
        run: |
          git diff --quiet sponsors.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sponsors.json
          git commit -m "sync sponsors [$(date -u +%Y-%m-%d %H:%M)]"
          git push
