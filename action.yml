name: 'yoyo Agent'
description: 'Run yoyo coding agents — free for open source, sponsors for private repos'
author: 'yologdev'

inputs:
  agent:
    description: 'Agent name (matches agents/<name>/ directory in harness)'
    required: true
  args:
    description: 'Arguments to pass to the agent (e.g., issue number for build, PR number for review)'
    required: false
    default: ''
  anthropic_api_key:
    description: 'Anthropic API key'
    required: true
  gh_token:
    description: 'GitHub token with repo access'
    required: true
  model:
    description: 'Claude model to use'
    required: false
    default: 'claude-opus-4-6'

runs:
  using: 'composite'
  steps:
    - name: Sponsor check (private repos only)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail

        VISIBILITY=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility' 2>/dev/null || echo "private")

        if [ "$VISIBILITY" = "public" ]; then
          echo "Running yoyo (open source — free)"
        else
          SPONSORS_URL="https://raw.githubusercontent.com/yologdev/yoyo-action/main/sponsors.json"
          if ! SPONSORS=$(curl -fsSL "$SPONSORS_URL"); then
            echo "::error::Failed to fetch sponsor list. Retrying..."
            sleep 2
            SPONSORS=$(curl -fsSL "$SPONSORS_URL")
          fi

          if echo "$SPONSORS" | python3 -c "import sys,json; owners=json.load(sys.stdin); sys.exit(0 if sys.argv[1] in owners else 1)" "$OWNER"; then
            echo "Running yoyo (sponsor: $OWNER)"
          else
            echo "::warning::yoyo is free for open source repos. For private repos, please sponsor yologdev."
            echo "::warning::https://github.com/sponsors/yologdev"
            exit 1
          fi
        fi

    - name: Download harness scripts
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail

        HARNESS_DIR="/tmp/yoyo-harness"
        rm -rf "$HARNESS_DIR"
        mkdir -p "$HARNESS_DIR"

        echo "Downloading yoyo harness..."
        curl -fsSL "https://github.com/yologdev/yoyo-harness/archive/refs/heads/main.tar.gz" \
          -o /tmp/harness.tar.gz
        tar xzf /tmp/harness.tar.gz -C "$HARNESS_DIR" --strip-components=1
        rm -f /tmp/harness.tar.gz

        chmod +x "$HARNESS_DIR/scripts/"*.sh
        find "$HARNESS_DIR/agents" -name "*.sh" -exec chmod +x {} \;
        echo "HARNESS_DIR=$HARNESS_DIR" >> "$GITHUB_ENV"

    - name: Install yoyo binary
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: |
        set -euo pipefail

        REPO="yologdev/yoyo-evolve"
        # Authenticate the release lookup. The unauthenticated api.github.com
        # limit is 60 requests/hour per IP and trips a 403 on shared runner IPs
        # (the JSON parse then fails on the empty body). The auth'd limit is 5000/h.
        LATEST=$(curl -fsSL \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/$REPO/releases/latest" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
        echo "Installing yoyo $LATEST..."

        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) TARGET="x86_64-unknown-linux-gnu" ;;
          aarch64|arm64) TARGET="aarch64-unknown-linux-gnu" ;;
          *) echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac

        curl -fsSL \
          -H "Authorization: Bearer $GH_TOKEN" \
          "https://github.com/$REPO/releases/download/$LATEST/yoyo-$LATEST-$TARGET.tar.gz" \
          -o /tmp/yoyo.tar.gz
        tar xzf /tmp/yoyo.tar.gz -C /tmp
        cp /tmp/yoyo "$HOME/.local/bin/yoyo" 2>/dev/null || {
          mkdir -p "$HOME/.local/bin"
          cp /tmp/yoyo "$HOME/.local/bin/yoyo" || cp /tmp/yoyo-*/yoyo "$HOME/.local/bin/yoyo"
        }
        chmod +x "$HOME/.local/bin/yoyo"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        rm -rf /tmp/yoyo.tar.gz /tmp/yoyo-evolve*

    - name: Run agent
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GH_TOKEN: ${{ inputs.gh_token }}
        REPO: ${{ github.repository }}
        MODEL: ${{ inputs.model }}
        AGENT_NAME: ${{ inputs.agent }}
        AGENT_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        "$HARNESS_DIR/scripts/run-agent.sh" "$AGENT_NAME" $AGENT_ARGS
